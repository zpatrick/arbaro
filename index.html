<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arbaro</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>
      <div id="message" class="message"></div>
      <div id="hint" class="hint">
        <span>Hold <kbd>↑</kbd> to grow</span>
        <span><kbd>←</kbd> <kbd>→</kbd> to steer</span>
        <span>Click a limb to select it, again to fork</span>
        <span>Hold <kbd>C</kbd> and click to prune</span>
        <span><kbd>R</kbd> to replant</span>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
